name: PHP version support

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issues instead of opening them
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check PHP version support
    runs-on: ubuntu-latest
    # Don't run on forks
    if: github.repository == 'open-telemetry/opentelemetry-php'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check PHP versions against the support policy
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: script/php-version-support.sh
