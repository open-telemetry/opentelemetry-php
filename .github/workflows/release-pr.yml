name: Release PR

# Opens or rebuilds a monorepo's release pull request, with dev-tools release:pr, when a maintainer
# asks: by dispatch, by ticking the box on a dashboard issue, or by editing the overrides. Contrib's
# is opened from here, as only this repository can read the otelbot-php key. A rebuild starts again
# from main and keeps the overrides in the description, so the pull request never conflicts.
#
# Nothing rebuilds it when main moves. The stale job runs release:pr:stale, which adds a note to the
# description instead. In core, that edit makes the Release approval check run again, and fail until
# the pull request is rebuilt. Contrib merges don't trigger this workflow, so contrib's is marked on
# the schedule.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '47 21 * * *' # daily, to mark contrib's stale
  workflow_dispatch:
    inputs:
      monorepo:
        description: Monorepo to release
        type: choice
        options: [ opentelemetry-php, opentelemetry-php-contrib ]
        default: opentelemetry-php
  issues:
    types: [ edited ]
  pull_request:
    types: [ edited ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-pr:
    name: Release PR for ${{ matrix.monorepo }}
    runs-on: ubuntu-latest
    # The bot's own edits to the description are skipped, or each rebuild would start another
    if: >-
      github.repository == 'open-telemetry/opentelemetry-php' && (
        github.event_name == 'workflow_dispatch' || (
          github.event_name == 'issues' &&
          github.event.issue.state == 'open' &&
          contains(github.event.issue.body, '- [x] Open a release PR') && (
            contains(github.event.issue.labels.*.name, 'release-dashboard:core') ||
            contains(github.event.issue.labels.*.name, 'release-dashboard:contrib')
          )
        ) || (
          github.event_name == 'pull_request' &&
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'otelbot/release' &&
          github.event.pull_request.user.login == 'otelbot-php[bot]' &&
          github.event.sender.type != 'Bot' &&
          github.event.changes.body
        )
      )
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && format('[{{"monorepo": "{0}"}}]', inputs.monorepo) ||
            github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'release-dashboard:contrib') && '[{"monorepo": "opentelemetry-php-contrib"}]' ||
            '[{"monorepo": "opentelemetry-php"}]'
          ) }}
    # A cancelled run can leave the description and the branch out of step
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.monorepo }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # to untick the box on the dashboard issue
    steps:
      # Edits made with GITHUB_TOKEN start no workflow, so this can't loop
      - name: Untick the box on the dashboard issue
        if: github.event_name == 'issues'
        shell: bash # with pipefail, which the default shell lacks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$NUMBER" --json body --jq .body | tr -d '\r' \
            | sed 's/^- \[x\] Open a release PR$/- [ ] Open a release PR/' > "$RUNNER_TEMP/issue.md"
          gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/issue.md"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_PHP_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PHP_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ matrix.monorepo }}
          permission-contents: write
          permission-pull-requests: write

      # Without ref, checking out this repository on pull_request takes the pull request's merge ref
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-telemetry/${{ matrix.monorepo }}
          ref: main
          path: monorepo
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      # As for the dashboard: release:prep needs only the runtime dependencies, and core requires
      # ext-grpc in require-dev.
      - name: Install dependencies
        working-directory: monorepo
        run: composer install --no-dev --prefer-dist --no-progress --no-plugins --ignore-platform-req=ext-grpc

      - name: Install dev-tools
        run: composer create-project --no-dev --prefer-dist --no-progress open-telemetry/dev-tools "$RUNNER_TEMP/dev-tools" dev-main

      # The description is untrusted text. release:pr checks each override before passing it to
      # release:prep, in process, so no shell sees it.
      - name: Open or rebuild the release pull request
        working-directory: monorepo
        env:
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          MONOREPO: open-telemetry/${{ matrix.monorepo }}
          BEFORE: ${{ github.event.changes.body.from }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          args=("--repository=$MONOREPO")
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf '%s' "$BEFORE" > "$RUNNER_TEMP/before.md"
            args+=(--rebuild-only "--previous-body-file=$RUNNER_TEMP/before.md")
          fi
          # Dispatch already needs write access
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            args+=("--sender=$SENDER")
          fi
          "$RUNNER_TEMP/dev-tools/bin/otel" release:pr --no-interaction "${args[@]}"

  stale:
    name: Mark the ${{ matrix.monorepo }} release PR stale
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'open-telemetry/opentelemetry-php' &&
      (github.event_name == 'push' || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        monorepo: ${{ fromJSON(github.event_name == 'push' && '["opentelemetry-php"]' || '["opentelemetry-php", "opentelemetry-php-contrib"]') }}
    concurrency:
      group: ${{ github.workflow }}-stale-${{ matrix.monorepo }}
      cancel-in-progress: true
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_PHP_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PHP_PRIVATE_KEY }}
          owner: open-telemetry
          repositories: ${{ matrix.monorepo }}
          permission-contents: read
          permission-pull-requests: write

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dev-tools
        run: composer create-project --no-dev --prefer-dist --no-progress open-telemetry/dev-tools "$RUNNER_TEMP/dev-tools" dev-main

      # The edit is made with the app token so that it starts the Release approval check, which
      # GITHUB_TOKEN's edits would not
      - name: Mark the pull request stale
        env:
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          MONOREPO: open-telemetry/${{ matrix.monorepo }}
        run: |
          "$RUNNER_TEMP/dev-tools/bin/otel" release:pr:stale --no-interaction "--repository=$MONOREPO"
