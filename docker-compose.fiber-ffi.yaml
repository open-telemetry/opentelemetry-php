version: '3.8'
services:
  web:
    image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
    ports:
      - '8080:80'
    depends_on:
      - php
    volumes:
      - ./docker/examples/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  php:
    build:
      context: .
      dockerfile: docker/examples/Dockerfile
      args:
        - PHP_VERSION=8.2-fpm
        - EXT_ENABLE=ffi
    environment:
      - OTEL_PHP_FIBERS_ENABLED=true
    command:
      - php-fpm
      - -d
      - opcache.preload=/php/vendor/autoload.php
    volumes:
      - ./tests/Integration/Context/Fiber/test_context_switching_ffi_observer.phpt:/var/www/public/index.php
      - ./:/php
