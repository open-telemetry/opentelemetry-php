file_format: '1.0'

propagator:
  composite:
    - tracecontext:
    - baggage:

response_propagator/development:
  composite: []

tracer_provider:
  sampler:
    parent_based:
      root:
        always_on:
  processors:
    - batch:
        exporter:
          console:
  tracer_configurator/development:
    default_config:
      enabled: false
    tracers:
      - name: A.*
        config:
          enabled: true
      - name: B.*
        config:
          enabled: false
meter_provider:
  readers:
    - periodic:
        exporter:
          console:
  meter_configurator/development:
    default_config:
      enabled: false
    meters:
      - name: A.*
        config:
          enabled: true
      - name: B.*
        config:
          enabled: false
logger_provider:
  processors:
    - batch:
        exporter:
          console:
  logger_configurator/development:
    default_config:
      enabled: false
    loggers:
      - name: A.*
        config:
          enabled: true
      - name: B.*
        config:
          enabled: false
