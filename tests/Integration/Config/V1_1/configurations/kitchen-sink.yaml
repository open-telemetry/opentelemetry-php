# kitchen-sink.yaml for file_format "1.1"
#
# Exercises all configurable surface area supported in the 1.1 schema, including:
#   - tls: sub-object for OTLP exporters (replaces 1.0-rc.2 flat certificate_file fields)
#   - attribute_value_depth_limit (accepted, runtime enforcement pending SDK support)
#   - log_level at root
#   - enabled: in configurator blocks (replaces 1.0-rc.2 disabled:)
#   - always_record sampler
#   - id_generator: { random: {} }
#   - container: resource detector
#   - max_request_size / max_response_size on OTLP exporters

file_format: "1.1"
disabled: false
log_level: info

attribute_limits:
  attribute_value_length_limit: 4096
  attribute_value_depth_limit: 64
  attribute_count_limit: 128

resource:
  attributes:
    - name: service.name
      value: my-service
  detection/development:
    attributes:
      included: ["service.*", "host.*", "process.*", "container.*"]
    detectors:
      - service:
      - host:
      - process:
      - container:

propagator:
  composite: [tracecontext, baggage]

tracer_provider:
  limits:
    attribute_value_length_limit: ~
    attribute_value_depth_limit: 64
    attribute_count_limit: 128
    event_count_limit: 128
    link_count_limit: 128
    event_attribute_count_limit: 128
    link_attribute_count_limit: 128
  sampler:
    always_record:
      root:
        parent_based:
          root: { always_on: {} }
  id_generator:
    random: {}
  processors:
    - batch:
        schedule_delay: 5000
        export_timeout: 30000
        max_queue_size: 2048
        max_export_batch_size: 512
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/traces
            tls:
              ca_file: ~
              cert_file: ~
              key_file: ~
            compression: gzip
            max_request_size: 67108864
            max_response_size: 4194304
            timeout: 10000
            encoding: protobuf
  tracer_configurator/development:
    default_config:
      enabled: true
    tracers:
      - name: "some-library"
        config:
          enabled: false

meter_provider:
  exemplar_filter: trace_based
  readers:
    - periodic:
        interval: 60000
        timeout: 30000
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/metrics
            tls:
              ca_file: ~
              cert_file: ~
              key_file: ~
            compression: gzip
            max_request_size: 67108864
            max_response_size: 4194304
            timeout: 10000
            temporality_preference: cumulative
            default_histogram_aggregation: explicit_bucket_histogram
  meter_configurator/development:
    default_config:
      enabled: true
    meters:
      - name: "some-meter"
        config:
          enabled: false

logger_provider:
  limits:
    attribute_value_length_limit: ~
    attribute_value_depth_limit: 64
    attribute_count_limit: 128
  processors:
    - batch:
        schedule_delay: 1000
        export_timeout: 30000
        max_queue_size: 2048
        max_export_batch_size: 512
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/logs
            tls:
              ca_file: ~
              cert_file: ~
              key_file: ~
            compression: gzip
            max_request_size: 67108864
            max_response_size: 4194304
            timeout: 10000
            encoding: protobuf
  logger_configurator/development:
    default_config:
      enabled: true
    loggers:
      - name: "some-logger"
        config:
          enabled: false
