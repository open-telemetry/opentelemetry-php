file_format: '1.0'

tracer_provider:
  processors:
    - simple:
        exporter:
          console:
  sampler:
    always_off:

propagator:
  composite: []

response_propagator/development:
  composite: []

instrumentation/development:
  php:
    example_instrumentation:
      span_name: my-span
  general:
    http:
      client:
        request_captured_headers:
          - Content-Type
          - Accept
        response_captured_headers:
          - Content-Type
          - Content-Encoding
      server:
        known_methods:
          - GET
          - POST
        request_captured_headers:
          - Content-Type
          - Accept
        response_captured_headers:
          - Content-Type
          - Content-Encoding
