file_format: '1.0'

resource:
  attributes:
    - name: service.name
      value: opentelemetry-demo
  attributes_list: service.name=unused,example.foo=foo_value,example.bar=bar_value

propagator:
  composite:
    - tracecontext:
    - baggage:

response_propagator/development:
  composite_list: "servertiming,traceresponse"

# shared OTLP/HTTP exporter settings, expanded below with a signal-specific endpoint
exporter_defaults: &otlp-exporter
  encoding: protobuf
  compression: gzip
  timeout: 10000

tracer_provider:
  sampler:
    parent_based:
      root:
        always_on:
  processors:
    - simple:
        exporter:
          console:
    - batch:
        exporter:
          otlp_http:
            <<: *otlp-exporter
            endpoint: http://collector:4318/v1/traces
meter_provider:
  readers:
    - periodic:
        exporter:
          console:
    - periodic:
        exporter:
          otlp_http:
            <<: *otlp-exporter
            endpoint: http://collector:4318/v1/metrics
            temporality_preference: low_memory
logger_provider:
  processors:
    - simple:
        exporter:
          console:
    - batch:
        exporter:
          otlp_http:
            <<: *otlp-exporter
            endpoint: http://collector:4318/v1/logs
