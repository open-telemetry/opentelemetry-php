
imports:
  - deptrac.baseline.yaml
deptrac:
    analyser:
        types:
            - class
            - class_superglobal
            - use
            - file
            - function
            - function_superglobal
    paths:
        - ./src
        - ./proto
        - ./tests
        - ./deptrac/polyfills
        - ./vendor/symfony/polyfill-php83/Resources/stubs
    exclude_files:
        - '#.*test.*#'
    layers:
      -   name: API
          collectors:
              -   type: directory
                  value: src/API/.*
      -   name: SDK
          collectors:
              -   type: directory
                  value: src/SDK/.*
      -   name: ConfigSDK
          collectors:
              -   type: directory
                  value: src/Config/SDK/.*
      -   name: Context
          collectors:
              -   type: directory
                  value: src/Context/.*
      -   name: SemConv
          collectors:
              -   type: directory
                  value: src/SemConv/.*
      -   name: Contrib
          collectors:
              -   type: directory
                  value: src/Contrib/.*
      -   name: Extension
          collectors:
              -   type: directory
                  value: src/Extension/.*
      -   name: OtelProto
          collectors:
              -   type: directory
                  value: proto/otel/.*
      -   name: GoogleProtobuf
          collectors:
              -   type: classNameRegex
                  value: '#^Google\\Protobuf\\*#'
      -   name: Grpc
          collectors:
              - type: classNameRegex
                value: '#^Grpc\\*#'
      -   name: PsrLog
          collectors:
              - type: classNameRegex
                value: '#^Psr\\Log\\*#'
      -   name: PsrHttp
          collectors:
              - type: classNameRegex
                value: '#^Psr\\Http\\*#'
      -   name: HttpPlug
          collectors:
              - type: classNameRegex
                value: '#^Http\\*#'
      -   name: Prometheus
          collectors:
              - type: classNameRegex
                value: '#^Prometheus\\*#'
      -   name: FFI
          collectors:
              - type: classNameRegex
                value: '#^FFI\\*#'
      -   name: Composer
          collectors:
              - type: classNameRegex
                value: '#^Composer\\*#'
      -   name: HttpClients
          collectors:
              - type: classNameRegex
                value: '#^Symfony\\Component\\HttpClient\\*#'
              - type: classNameRegex
                value: '#^GuzzleHttp\\*#'
              - type: classNameRegex
                value: '#^Buzz\\*#'
      -   name: SPI
          collectors:
              - type: classNameRegex
                value: '#^Nevay\\SPI\\*#'
      -   name: SymfonyConfig
          collectors:
              - type: classNameRegex
                value: '#^Symfony\\Component\\Config\\*#'
              - type: classNameRegex
                value: '#^Symfony\\Component\\Yaml\\*#'
              - type: classNameRegex
                value: '#^Symfony\\Component\\VarExporter\\*#'
      -   name: RamseyUuid
          collectors:
              - type: classNameRegex
                value: '#^Ramsey\\Uuid\\*#'
      -   name: NyholmPsr7Server
          collectors:
              - type: classNameRegex
                value: '#^Nyholm\\Psr7Server\\*#'
      -   name: Polyfills
          collectors:
              - type: directory
                value: deptrac/polyfills/.*
              - type: directory
                value: vendor/symfony/polyfill-php83
      -   name: DotenvProvider
          collectors:
            - type: classNameRegex
              value: '#^Symfony\\Component\\Dotenv\\*#'
            - type: classNameRegex
              value: '#^Dotenv\\*#'
    ruleset:
      Context:
          - FFI
          - Polyfills
      SemConv: ~
      ConfigSDK:
          - SymfonyConfig
          - API
          - SDK
          - SPI
          - PsrLog
          - Composer
          - Context
          - Contrib
          - Extension
          - Polyfills
          - DotenvProvider
      API:
          - Context
          - PsrLog
          - SPI
          - Polyfills
      SDK:
          - +API
          - ConfigSDK
          - SemConv
          - PsrHttp
          - HttpPlug
          - Composer
          - HttpClients
          - SPI
          - RamseyUuid
          - NyholmPsr7Server
      Contrib:
          - +SDK
          - +OtelProto
          - Grpc
          - Prometheus
      Extension:
          - +API
      OtelProto:
          - GoogleProtobuf
          - Grpc
