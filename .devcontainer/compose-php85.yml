# Pins the image and the dependency volumes for PHP 8.5. Volume names are explicit so
# switching between PHP versions never reuses another version's installed dependencies.
services:
  php-dev:
    build:
      args:
        PHP_VERSION: "8.5"
    image: opentelemetry-php-dev:8.5

volumes:
  vendor:
    name: otel-php-dev-85-vendor
  vendor-bin-deptrac:
    name: otel-php-dev-85-deptrac
  vendor-bin-infection:
    name: otel-php-dev-85-infection
  vendor-bin-phan:
    name: otel-php-dev-85-phan
  vendor-bin-php-cs-fixer:
    name: otel-php-dev-85-php-cs-fixer
  vendor-bin-phpbench:
    name: otel-php-dev-85-phpbench
  vendor-bin-phpmetrics:
    name: otel-php-dev-85-phpmetrics
  vendor-bin-psalm:
    name: otel-php-dev-85-psalm
  vendor-bin-rector:
    name: otel-php-dev-85-rector
  composer-cache:
    name: otel-php-dev-85-composer-cache
