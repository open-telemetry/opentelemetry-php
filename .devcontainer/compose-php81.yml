# Pins the image and the dependency volumes for PHP 8.1. Volume names are explicit so
# switching between PHP versions never reuses another version's installed dependencies.
services:
  php-dev:
    build:
      args:
        PHP_VERSION: "8.1"
    image: opentelemetry-php-dev:8.1

volumes:
  vendor:
    name: otel-php-dev-81-vendor
  vendor-bin-deptrac:
    name: otel-php-dev-81-deptrac
  vendor-bin-infection:
    name: otel-php-dev-81-infection
  vendor-bin-phan:
    name: otel-php-dev-81-phan
  vendor-bin-php-cs-fixer:
    name: otel-php-dev-81-php-cs-fixer
  vendor-bin-phpbench:
    name: otel-php-dev-81-phpbench
  vendor-bin-phpmetrics:
    name: otel-php-dev-81-phpmetrics
  vendor-bin-psalm:
    name: otel-php-dev-81-psalm
  vendor-bin-rector:
    name: otel-php-dev-81-rector
  composer-cache:
    name: otel-php-dev-81-composer-cache
