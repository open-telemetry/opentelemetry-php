# Pins the image and the dependency volumes for PHP 8.2. Volume names are explicit so
# switching between PHP versions never reuses another version's installed dependencies.
services:
  php-dev:
    build:
      args:
        PHP_VERSION: "8.2"
    image: opentelemetry-php-dev:8.2

volumes:
  vendor:
    name: otel-php-dev-82-vendor
  vendor-bin-deptrac:
    name: otel-php-dev-82-deptrac
  vendor-bin-infection:
    name: otel-php-dev-82-infection
  vendor-bin-phan:
    name: otel-php-dev-82-phan
  vendor-bin-php-cs-fixer:
    name: otel-php-dev-82-php-cs-fixer
  vendor-bin-phpbench:
    name: otel-php-dev-82-phpbench
  vendor-bin-phpmetrics:
    name: otel-php-dev-82-phpmetrics
  vendor-bin-psalm:
    name: otel-php-dev-82-psalm
  vendor-bin-rector:
    name: otel-php-dev-82-rector
  composer-cache:
    name: otel-php-dev-82-composer-cache
